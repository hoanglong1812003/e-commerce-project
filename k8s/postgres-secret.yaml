# NOTE (learning project): secrets are committed in plaintext here for simplicity.
# In a real environment, use sealed-secrets, SOPS, or an external secret manager instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: ecommerce
  POSTGRES_PASSWORD: ecommerce
  POSTGRES_DB: ecommerce
