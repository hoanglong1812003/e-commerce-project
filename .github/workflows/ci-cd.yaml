name: CI/CD

on:
  push:
    branches: [main]
    # Manifest-bump commits made by this workflow only touch k8s/**, so
    # excluding that path here prevents the job from triggering itself.
    paths-ignore:
      - "k8s/**"
      - "**.md"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            longshen4444/e-commerce:backend-${{ steps.vars.outputs.sha_short }}
            longshen4444/e-commerce:backend-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            longshen4444/e-commerce:frontend-${{ steps.vars.outputs.sha_short }}
            longshen4444/e-commerce:frontend-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Bump image tags in k8s manifests (GitOps)
        run: |
          sed -i "s#image: longshen4444/e-commerce:backend-.*#image: longshen4444/e-commerce:backend-${{ steps.vars.outputs.sha_short }}#" k8s/backend-deployment.yaml
          sed -i "s#image: longshen4444/e-commerce:frontend-.*#image: longshen4444/e-commerce:frontend-${{ steps.vars.outputs.sha_short }}#" k8s/frontend-deployment.yaml

      - name: Commit & push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: deploy backend/frontend @ ${{ steps.vars.outputs.sha_short }}"
            git push
          fi
